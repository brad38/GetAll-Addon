name: Validate GetAll-Addon Recipes

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate schemas, index, SHA-256, paths and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema validator
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate schemas, index.json, SHA-256 hashes and recipe contracts
        run: |
          python scripts/validate_recipes.py \
            --strict-lf \
            --require-jsonschema \
            --check-git-blobs \
            --check-catalog

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
