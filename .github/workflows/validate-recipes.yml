name: Validate GetAll-Addon Recipes

on:
  pull_request:
  push:
    branches:
      - main
      - feat/marathon-xbox-media-import
      - feat/sm64plus-handoff
      - work/official-install-scope-20261127
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate schemas, index, SHA-256, paths and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema validator
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate schemas, index.json, SHA-256 hashes and recipe contracts
        run: python scripts/validate_ci.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Preserve coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: installation-coverage
          path: catalog-coverage-report.json
          retention-days: 14
