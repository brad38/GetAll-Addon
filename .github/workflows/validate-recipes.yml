name: Validate GetAll-Addon Recipes

on:
  pull_request:
  push:
    branches:
      - main
      - feat/marathon-xbox-media-import
      - feat/sm64plus-handoff
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate schemas, index, SHA-256, paths and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema validator
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate schemas, index.json, SHA-256 hashes and recipe contracts
        env:
          PR_SOURCE: ${{ github.head_ref }}
          PR_TARGET: ${{ github.base_ref }}
        run: |
          catalog=https://raw.githubusercontent.com/brad38/AllFix-Repo/main/catalog.json
          if [ "$GITHUB_REF" = refs/heads/main ] || { [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$PR_TARGET" = main ] && [ "$PR_SOURCE" != feat/round-17-restricted-installers ]; }; then
            python -c 'import json; assert json.load(open("index.json", encoding="utf-8")).get("channel", "public") == "public", "Preview index must not be served as production"'
          fi
          if [ "$GITHUB_REF" = refs/heads/feat/sm64plus-handoff ] || [ "$GITHUB_REF" = refs/heads/feat/marathon-xbox-media-import ] || [ "$GITHUB_REF" = refs/heads/feat/round-17-restricted-installers ] || { [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$PR_SOURCE" = feat/round-17-restricted-installers ]; }; then
            # PR #18 depends on the catalog identities staged for review in issue #8.
            catalog=https://raw.githubusercontent.com/brad38/AllFix-Repo/3f4603cf42ef43402b4a0a9470232e7d4fcd9eb9/catalog.json
          fi
          python scripts/validate_recipes.py \
            --strict-lf \
            --require-jsonschema \
            --check-git-blobs \
            --check-catalog "$catalog"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
