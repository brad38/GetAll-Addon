name: Upstream Catalog & Release Watch

on:
  schedule:
    # Diariamente as 09:00 UTC (06:00 BRT)
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Escopo de consulta de releases"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ab
          - tracked
      apply_updates:
        description: "Propor atualizacoes experimentais seguras quando compativeis com o SDK"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    name: Monitor AllFix-Repo and official GitHub releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema validator
        run: python -m pip install --upgrade pip jsonschema

      - name: Select reviewed channel and automation base
        id: target
        run: |
          python - << 'PY'
          import json, os
          from scripts.validate_ci import watch_target
          index = json.load(open("index.json", encoding="utf-8"))
          target = watch_target(index, os.environ)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in target.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Check for existing open automation Pull Request
        id: pr_check
        env:
          WATCH_BRANCH: ${{ steps.target.outputs.branch }}
          WATCH_BASE: ${{ steps.target.outputs.base }}
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.WATCH_BRANCH;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${context.repo.owner}:${branch}`,
              base: process.env.WATCH_BASE
            });
            if (pulls.length > 0) {
              core.setOutput("pr_number", String(pulls[0].number));
              core.setOutput("pr_url", pulls[0].html_url);
            } else {
              core.setOutput("pr_number", "");
            }

      - name: Prepare automation branch workspace
        env:
          WATCH_BRANCH: ${{ steps.target.outputs.branch }}
          WATCH_BASE: ${{ steps.target.outputs.base }}
          WATCH_PR: ${{ steps.pr_check.outputs.pr_number }}
        run: |
          BRANCH="$WATCH_BRANCH"
          if [ -n "$WATCH_PR" ]; then
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
            git fetch origin "$WATCH_BASE"
            git merge --no-edit "origin/$WATCH_BASE"
          else
            git switch -C "$BRANCH"
          fi

      - name: Check AllFix-Repo catalog and GitHub releases
        id: watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_APPLY: ${{ inputs.apply_updates }}
        run: |
          SCOPE="${INPUT_SCOPE:-all}"
          APPLY_FLAG="--apply-updates"
          if [ "${INPUT_APPLY}" = "false" ]; then
            APPLY_FLAG=""
          fi

          python scripts/upstream_watch.py \
            --scope "$SCOPE" \
            $APPLY_FLAG \
            --inspect-assets \
            --json-out "$RUNNER_TEMP/upstream-status.json" \
            --report-out "$RUNNER_TEMP/upstream-report.md"

          python - << 'EOF'
          import json, os
          data = json.load(open(os.environ["RUNNER_TEMP"] + "/upstream-status.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"actionable={'true' if data['has_actionable_changes'] else 'false'}\n")
              out.write(f"fingerprint={data['fingerprint']}\n")
              out.write(f"updated_count={len(data['updated_recipes'])}\n")
              out.write(f"pending_count={len(data['pending_reviews'])}\n")
              out.write(f"new_projects_count={len(data['new_catalog_projects'])}\n")
          EOF

      - name: Write report and validate all changes before publishing
        if: steps.watch.outputs.actionable == 'true'
        run: |
          cp "$RUNNER_TEMP/upstream-report.md" docs/MONITORAMENTO-UPSTREAM.md
          python scripts/validate_ci.py
          python -m unittest discover -s tests -v

      - name: Commit and push automation branch (without force push)
        id: git_push
        env:
          WATCH_BRANCH: ${{ steps.target.outputs.branch }}
          WATCH_FINGERPRINT: ${{ steps.watch.outputs.fingerprint }}
        if: steps.watch.outputs.actionable == 'true'
        run: |
          BRANCH="$WATCH_BRANCH"
          if [ -z "$(git status --porcelain)" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json recipes docs
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(upstream): atualizar monitoramento ($WATCH_FINGERPRINT)"
          git push -u origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update Pull Request for human review
        env:
          WATCH_BRANCH: ${{ steps.target.outputs.branch }}
          WATCH_BASE: ${{ steps.target.outputs.base }}
        if: steps.git_push.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync(`${process.env.RUNNER_TEMP}/upstream-report.md`, "utf8");
            const fp = "${{ steps.watch.outputs.fingerprint }}";
            const updated = "${{ steps.watch.outputs.updated_count }}";
            const pending = "${{ steps.watch.outputs.pending_count }}";
            const newProj = "${{ steps.watch.outputs.new_projects_count }}";
            const prNumber = "${{ steps.pr_check.outputs.pr_number }}";
            const branch = process.env.WATCH_BRANCH;

            const body = [
              "Pull Request gerado automaticamente pelo workflow **Upstream Catalog & Release Watch**.",
              "",
              `- **Resumo:** ${updated} receita(s) experimental(is) proposta(s), ${pending} pendência(s) técnica(s), ${newProj} novo(s) projeto(s) no catálogo.`,
              "- **Política:** somente projetos elegíveis podem receber propostas; candidatos/excluídos ficam em revisão. Nenhuma receita suspensa foi reativada nem promovida a `validated`; nenhum merge foi realizado.",
              "",
              "---",
              "",
              report
            ].join("\n");

            if (prNumber) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
                title: `chore(upstream): novidades detectadas (${fp})`,
                body
              });
            } else {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `chore(upstream): novidades detectadas (${fp})`,
                head: branch,
                base: process.env.WATCH_BASE,
                body
              });
            }

      - name: Preserve the small monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-review-report
          path: |
            ${{ runner.temp }}/upstream-status.json
            ${{ runner.temp }}/upstream-report.md
          retention-days: 14
